[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-benchmark-verification"
version = "0.1.0"
description = "Frozen Terra benchmark graders and reference calculations"
requires-python = ">=3.12"
dependencies = ["geopandas>=1.0,<2", "rasterio>=1.4,<2", "pyarrow>=19,<22", "geographiclib>=2,<3", "scipy==1.16.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["terra_bench"]
